<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel de Controle - Bot Shinobi</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background-color: #1e293b;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .badge-conta {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: bold;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      background-color: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      color: #38bdf8;
      font-size: 0.95rem;
      font-weight: bold;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .input-field:focus {
      border-color: #38bdf8;
    }

    /* Animação e Borda Vermelha para Erro */
    .input-field.input-error {
      border-color: #ef4444 !important;
      background-color: rgba(239, 68, 68, 0.1) !important;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .btn-action {
      width: 100%;
      padding: 16px;
      margin-top: 6px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.97);
      background-color: #0369a1;
    }

    /* Painel de Logs */
    .logs-container {
      margin-top: 20px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
    }

    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: bold;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .logs-list {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-item {
      background-color: #1e293b;
      border-left: 4px solid #38bdf8;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .log-title {
      font-weight: bold;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
    }

    .log-time {
      font-weight: normal;
      font-size: 0.75rem;
      color: #64748b;
    }

    .log-status {
      font-size: 0.75rem;
      color: #eab308; /* Amarelo enviando */
    }

    .log-status.deleted {
      color: #ef4444; /* Vermelho deletado */
    }

    /* Toast Dynamic Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #10b981;
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: bold;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s, background-color 0.2s;
      pointer-events: none;
      z-index: 999;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.toast-error {
      background-color: #ef4444;
    }

    .captcha-preview {
      margin-bottom: 14px;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      text-align: center;
    }

    .captcha-preview img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #475569;
    }

    .captcha-preview p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 8px;
    }

    .ocr-status {
      font-size: 0.8rem;
      color: #eab308;
      margin-bottom: 10px;
      min-height: 1.2em;
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      background: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    .nome-comando-oculto { display: none; }
    body.modo-auto .btn-action,

    body.modo-auto .logs-container { opacity: 0.35; pointer-events: none; }
    body.modo-auto .header h1 { font-size: 1.25rem; }
    .badge-auto { display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px;
      background: #1e3a5f; color: #93c5fd; font-size: 0.75rem; font-weight: 600; }

    function ehPixelDigitoSos(r, g, b) {
      if (r < 180 || g < 140 || b > 110) return false;
      if (r - g < 20 || r - g > 90) return false;
      if (g - b < 60) return false;
      return true;
    }

    function criarMascaraSos(imgData, w, h) {
      const mask = new Uint8Array(w * h);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          mask[y * w + x] = ehPixelDigitoSos(imgData[i], imgData[i + 1], imgData[i + 2]) ? 1 : 0;
        }
      }
      return mask;
    }

    function limparRuidoIsoladoSos(mask, w, h) {
      const nxt = new Uint8Array(mask.length);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (!mask[y * w + x]) continue;
          let n = 0;
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (!dx && !dy) continue;
              const nx = x + dx;
              const ny = y + dy;
              if (nx >= 0 && ny >= 0 && nx < w && ny < h && mask[ny * w + nx]) n++;
            }
          }
          if (n >= 1) nxt[y * w + x] = 1;
        }
      }
      return nxt;
    }

    function encontrarComponentesSos(mask, w, h, minArea) {
      const vis = new Uint8Array(w * h);
      const comps = [];

      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          if (!mask[idx] || vis[idx]) continue;

          const q = [[x, y]];
          let minx = x;
          let maxx = x;
          let miny = y;
          let maxy = y;
          let area = 0;
          vis[idx] = 1;

          while (q.length) {
            const pt = q.pop();
            const cx = pt[0];
            const cy = pt[1];
            area++;
            minx = Math.min(minx, cx);
            maxx = Math.max(maxx, cx);
            miny = Math.min(miny, cy);
            maxy = Math.max(maxy, cy);

            const viz = [[1, 0], [-1, 0], [0, 1], [0, -1]];
            for (let v = 0; v < viz.length; v++) {
              const nx = cx + viz[v][0];
              const ny = cy + viz[v][1];
              if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
              const ni = ny * w + nx;
              if (mask[ni] && !vis[ni]) {
                vis[ni] = 1;
                q.push([nx, ny]);
              }
            }
          }

          if (area >= minArea) {
            comps.push({ minx: minx, maxx: maxx, miny: miny, maxy: maxy, area: area });
          }
        }
      }

      return comps;
    }

    function sobreposicaoXSos(a, b) {
      const left = Math.max(a.minx, b.minx);
      const right = Math.min(a.maxx, b.maxx);
      const inter = right - left + 1;
      if (inter <= 0) return 0;
      const wa = a.maxx - a.minx + 1;
      const wb = b.maxx - b.minx + 1;
      return inter / Math.min(wa, wb);
    }

    function fundirBboxSos(a, b) {
      return {
        minx: Math.min(a.minx, b.minx),
        maxx: Math.max(a.maxx, b.maxx),
        miny: Math.min(a.miny, b.miny),
        maxy: Math.max(a.maxy, b.maxy),
        area: a.area + b.area
      };
    }

    function fundirComponentesSobrepostosXSos(comps) {
      const items = comps.slice().sort(function(a, b) { return a.minx - b.minx; });
      let changed = true;
      while (changed) {
        changed = false;
        for (let i = 0; i < items.length; i++) {
          for (let j = i + 1; j < items.length; j++) {
            if (sobreposicaoXSos(items[i], items[j]) >= 0.45) {
              const merged = fundirBboxSos(items[i], items[j]);
              if (merged.maxx - merged.minx + 1 <= 24) {
                items[i] = merged;
                items.splice(j, 1);
                changed = true;
                break;
              }
            }
          }
          if (changed) break;
        }
      }
      return items;
    }

    function bboxNaFaixaSos(mask, w, h, x0, x1) {
      let minx = w;
      let maxx = -1;
      let miny = h;
      let maxy = -1;
      let area = 0;
      x0 = Math.max(0, x0);
      x1 = Math.min(w - 1, x1);
      for (let y = 0; y < h; y++) {

          maxx = Math.max(maxx, x);
          miny = Math.min(miny, y);
          maxy = Math.max(maxy, y);
        }

      if (area === 0) return null;
      return { minx: minx, maxx: maxx, miny: miny, maxy: maxy, area: area };

      };
      const rowCount = function(y) {
        let c = 0;
        for (let x = minx; x <= maxx; x++) if (mask[y * w + x]) c++;
        return c;
      };
      while (minx < maxx && colCount(minx) === 0) minx++;
      while (maxx > minx && colCount(maxx) === 0) maxx--;
      while (miny < maxy && rowCount(miny) === 0) miny++;
      while (maxy > miny && rowCount(maxy) === 0) maxy--;
      return { minx: minx, maxx: maxx, miny: miny, maxy: maxy, area: bbox.area };
    }

    function projecaoVerticalSos(mask, w, h) {
      const proj = new Array(w).fill(0);
      for (let x = 0; x < w; x++) {
        for (let y = 0; y < h; y++) {
          if (mask[y * w + x]) proj[x]++;
        }
      }
      return proj;
    }

    function segmentarPorProjecaoSos(mask, w, h) {
      const proj = projecaoVerticalSos(mask, w, h);
      const thr = 1;
      let segs = [];
      let inSeg = false;
      let start = 0;

      for (let x = 0; x < w; x++) {
        if (proj[x] >= thr && !inSeg) {
          inSeg = true;
          start = x;
        } else if (proj[x] < thr && inSeg) {
          inSeg = false;
          segs.push({ minx: start, maxx: x - 1 });
        }
      }
      if (inSeg) segs.push({ minx: start, maxx: w - 1 });

      segs = segs.filter(function(s) { return (s.maxx - s.minx + 1) >= 3; });

      while (segs.length > 5) {
        let best = 0;
        let bg = 1e9;
        for (let i = 0; i < segs.length - 1; i++) {
          const g = segs[i + 1].minx - segs[i].maxx;
          if (g < bg) { bg = g; best = i; }
        }
        segs[best] = { minx: segs[best].minx, maxx: segs[best + 1].maxx };
        segs.splice(best + 1, 1);
      }

      while (segs.length && segs.length < 5) {
        let wi = 0;
        let mx = 0;
        for (let i = 0; i < segs.length; i++) {
          const wd = segs[i].maxx - segs[i].minx;
          if (wd > mx) { mx = wd; wi = i; }
        }
        const a = segs[wi].minx;
        const b = segs[wi].maxx;
        let bx = -1;
        let bv = 1e9;
        for (let x = a + 2; x < b - 2; x++) {
          if (proj[x] < bv) { bv = proj[x]; bx = x; }
        }
        if (bx < 0) bx = Math.floor((a + b) / 2);
        segs.splice(wi, 1, { minx: a, maxx: bx }, { minx: bx + 1, maxx: b });
      }

      if (segs.length < 5) {
        segs = [];
        for (let i = 0; i < 5; i++) {
          segs.push({
            minx: Math.round(i * w / 5),
            maxx: Math.round((i + 1) * w / 5) - 1
          });
        }
      }

      return segs.slice(0, 5).map(function(s) {
        const bbox = bboxNaFaixaSos(mask, w, h, s.minx, s.maxx);
        if (!bbox) {
          return { minx: s.minx, maxx: s.maxx, miny: 8, maxy: h - 8, area: 0 };
        }
        return apertarBboxSos(mask, w, h, bbox);
      });
    }

    function segmentarCincoDigitosSos(mask, w, h) {
      const comps = fundirComponentesSobrepostosXSos(
        encontrarComponentesSos(mask, w, h, SOS_MIN_AREA_COMPONENTE)
      );
      const bons = comps.filter(function(c) {
        const wd = c.maxx - c.minx + 1;
        const ht = c.maxy - c.miny + 1;
        return wd >= 4 && ht >= 6 && wd <= 28 && ht <= 32 && c.area >= 10;
      }).sort(function(a, b) { return a.minx - b.minx; });

      if (bons.length === 5) {
        return bons.map(function(c) { return apertarBboxSos(mask, w, h, c); });
      }
      if (bons.length > 5) {
        bons.sort(function(a, b) { return b.area - a.area; });
        return bons.slice(0, 5).sort(function(a, b) { return a.minx - b.minx; })
          .map(function(c) { return apertarBboxSos(mask, w, h, c); });
      }
      return segmentarPorProjecaoSos(mask, w, h);
    }

    function extrairGridDigitoSos(mask, w, h, bbox) {
      const y0 = bbox.miny;
      const y1 = bbox.maxy;
      if (y0 == null || y1 == null || y0 > y1) return null;

      const gw = Math.max(1, bbox.maxx - bbox.minx + 1);
      const gh = Math.max(1, y1 - y0 + 1);
      const grid = [];

      for (let gy = 0; gy < SOS_GRID_H; gy++) {
        let row = '';
        for (let gx = 0; gx < SOS_GRID_W; gx++) {
          const x0 = bbox.minx + Math.floor(gx * gw / SOS_GRID_W);
          const x1 = bbox.minx + Math.floor((gx + 1) * gw / SOS_GRID_W) - 1;
          const sy0 = y0 + Math.floor(gy * gh / SOS_GRID_H);
          const sy1 = y0 + Math.floor((gy + 1) * gh / SOS_GRID_H) - 1;
          let on = 0;
          let tot = 0;
          for (let y = sy0; y <= Math.max(sy0, sy1); y++) {
            for (let x = x0; x <= Math.max(x0, x1); x++) {
              tot++;
              if (mask[y * w + x]) on++;
            }
          }
          row += (tot && on / tot >= 0.35) ? '1' : '0';
        }
        grid.push(row);
      }

      return grid;
    }

    function pontuarGridTemplateSos(grid, template) {
      let inter = 0;
      let union = 0;
      let xor = 0;
      const total = SOS_GRID_W * SOS_GRID_H;

      for (let y = 0; y < SOS_GRID_H; y++) {
        for (let x = 0; x < SOS_GRID_W; x++) {
          const g = grid[y][x] === '1';
          const t = template[y][x] === '1';
          if (g || t) union++;
          if (g && t) inter++;
          if (g !== t) xor++;
        }
      }

      const iou = union ? inter / union : 0;
      const acc = 1 - xor / total;
      return iou * 0.75 + acc * 0.25;
    }

    function pontuarGridComDeslocamentoSos(grid, template) {
      let melhor = pontuarGridTemplateSos(grid, template);
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          if (!dx && !dy) continue;
          const shifted = [];
          for (let y = 0; y < SOS_GRID_H; y++) {
            let row = '';
            for (let x = 0; x < SOS_GRID_W; x++) {
              const sx = x - dx;
              const sy = y - dy;
              row += (sy >= 0 && sy < SOS_GRID_H && sx >= 0 && sx < SOS_GRID_W && grid[sy][sx] === '1') ? '1' : '0';
            }
            shifted.push(row);
          }
          const score = pontuarGridTemplateSos(shifted, template);
          if (score > melhor) melhor = score;
        }
      }
      return melhor;
    }

    function classificarGridDigitoSos(grid) {
      let melhorChar = '';
      let melhorScore = -1;
      let segundoChar = '';
      let segundoScore = -1;

      for (const dig in SOS_DIGIT_TEMPLATES) {
        const tpls = SOS_DIGIT_TEMPLATES[dig];
        let scoreDig = -1;
        for (let t = 0; t < tpls.length; t++) {
          const score = pontuarGridComDeslocamentoSos(grid, tpls[t]);
          if (score > scoreDig) scoreDig = score;
        }
        if (scoreDig > melhorScore) {
          segundoScore = melhorScore;
          segundoChar = melhorChar;
          melhorScore = scoreDig;
          melhorChar = dig;
        } else if (scoreDig > segundoScore) {
          segundoScore = scoreDig;
          segundoChar = dig;
        }
      }

      return {
        char: melhorChar,
        score: melhorScore,
        segundo: segundoChar,
        scoreSegundo: segundoScore
      };
    }

    function gridParaCanvasAmpliado(grid, escala) {
      const c = document.createElement('canvas');
      c.width = SOS_GRID_W * escala;
      c.height = SOS_GRID_H * escala;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.fillStyle = '#000';
      for (let y = 0; y < SOS_GRID_H; y++) {
        for (let x = 0; x < SOS_GRID_W; x++) {
          if (grid[y][x] === '1') {
            ctx.fillRect(x * escala, y * escala, escala, escala);
          }
        }
      }
      return c;
    }

    function canvasMascaraSos(img) {
      const base = escalaImagemCaptcha(img, SOS_SCALE);
      const imgData = base.ctx.getImageData(0, 0, base.w, base.h);
      const mask = limparRuidoIsoladoSos(criarMascaraSos(imgData.data, base.w, base.h), base.w, base.h);

      const out = document.createElement('canvas');
      out.width = base.w;
      out.height = base.h;
      const ctx = out.getContext('2d');
      const outData = ctx.createImageData(base.w, base.h);
      for (let i = 0; i < mask.length; i++) {
        const v = mask[i] ? 0 : 255;
        const p = i * 4;
        outData.data[p] = v;
        outData.data[p + 1] = v;
        outData.data[p + 2] = v;
        outData.data[p + 3] = 255;
      }
      ctx.putImageData(outData, 0, 0);
      return { canvas: out, mask: mask, w: base.w, h: base.h };
    }

    async function classificarGridComTesseract(grid) {
      const canvas = gridParaCanvasAmpliado(grid, 5);
      const psms = ['10', '8'];
      for (let i = 0; i < psms.length; i++) {
        try {
          const parsed = await reconhecerCanvas(canvas, psms[i]);
          const ch = extrairDigitosOcr(parsed.digits).charAt(0);
          if (ch) return { char: ch, score: Math.max(0.48, parsed.confidence / 100) };
        } catch (e) {}
      }
      return null;
    }

    async function ocrSosGame(img) {
      const proc = canvasMascaraSos(img);
      const segmentos = segmentarCincoDigitosSos(proc.mask, proc.w, proc.h);
      if (!segmentos || segmentos.length !== 5) {
        console.warn('[OCR SOS] segmentacao falhou —', segmentos ? segmentos.length : 0, 'partes');
        return null;
      }

      let codigo = '';
      let confTotal = 0;
      const posicoes = [];

      for (let i = 0; i < 5; i++) {
        const grid = extrairGridDigitoSos(proc.mask, proc.w, proc.h, segmentos[i]);
        if (!grid) return null;

        let cls = classificarGridDigitoSos(grid);

        if (cls.score < 0.55 || (cls.scoreSegundo > 0 && cls.score - cls.scoreSegundo < 0.05)) {
          const tesseract = await classificarGridComTesseract(grid);
          if (tesseract && tesseract.score > cls.score) {
            cls = { char: tesseract.char, score: tesseract.score, segundo: cls.segundo, scoreSegundo: cls.score };
          }
        }

        if (!cls.char) return null;
        codigo += cls.char;
        confTotal += cls.score;
        posicoes.push({
          char: cls.char,
          conf: cls.score,
          alternativas: cls.segundo ? [{ char: cls.segundo, conf: cls.scoreSegundo }] : []
        });
      }

      return {
        digits: codigo,
        confidence: (confTotal / 5) * 100,
        posicoes: posicoes,
        psm: 'sos-template',
        variantId: 'sos-game',
        peso: 45,
        metodo: 'sos-template'
      };
    }

    function obterCinza(r, g, b) {
      return Math.round(0.299 * r + 0.587 * g + 0.114 * b);
    }

    function calcularOtsuThreshold(cinzas) {
      const hist = new Array(256).fill(0);
      for (let i = 0; i < cinzas.length; i++) hist[cinzas[i]]++;

      const total = cinzas.length;
      let sum = 0;
      for (let i = 0; i < 256; i++) sum += i * hist[i];

      let sumB = 0;
      let wB = 0;
      let maxVar = 0;
      let threshold = 128;

      for (let t = 0; t < 256; t++) {
        wB += hist[t];
        if (wB === 0) continue;
        const wF = total - wB;
        if (wF === 0) break;

        sumB += t * hist[t];
        const mB = sumB / wB;
        const mF = (sum - sumB) / wF;
        const varBetween = wB * wF * (mB - mF) * (mB - mF);

        if (varBetween > maxVar) {
          maxVar = varBetween;
          threshold = t;
        }
      }

      return threshold;
    }

    function aplicarMascaraPixels(ctx, w, h, fnPixel) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = fnPixel(d[i], d[i + 1], d[i + 2]);
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      return ctx.canvas;
    }

    function variantAmarelo(ctx, w, h) {
      return aplicarMascaraPixels(ctx, w, h, function(r, g, b) {
        return ehPixelDigitoSos(r, g, b) ? 0 : 255;
      });
    }

    function variantOtsu(ctx, w, h, inverter) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      const cinzas = [];

      for (let i = 0; i < d.length; i += 4) {
        cinzas.push(obterCinza(d[i], d[i + 1], d[i + 2]));
      }

      const limiar = calcularOtsuThreshold(cinzas);
      let idx = 0;
      for (let i = 0; i < d.length; i += 4) {
        const escuro = cinzas[idx++] <= limiar;
        const v = inverter ? (escuro ? 255 : 0) : (escuro ? 0 : 255);
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }

      ctx.putImageData(imgData, 0, 0);
      return ctx.canvas;
    }

    function variantContraste(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      let min = 255;
      let max = 0;

      for (let i = 0; i < d.length; i += 4) {
        const c = obterCinza(d[i], d[i + 1], d[i + 2]);
        if (c < min) min = c;
        if (c > max) max = c;
      }

      const faixa = Math.max(1, max - min);
      for (let i = 0; i < d.length; i += 4) {
        const c = obterCinza(d[i], d[i + 1], d[i + 2]);
        const norm = Math.round(((c - min) / faixa) * 255);
        const v = norm > 128 ? 0 : 255;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }

      ctx.putImageData(imgData, 0, 0);
      return ctx.canvas;
    }

    function variantCinza(ctx, w, h) {
      return aplicarMascaraPixels(ctx, w, h, function(r, g, b) {
        return obterCinza(r, g, b);
      });
    }

    function variantAmareloStrict(ctx, w, h) {
      return aplicarMascaraPixels(ctx, w, h, function(r, g, b) {
        return ehPixelDigitoSos(r, g, b) ? 0 : 255;
      });
    }

    function variantOtsuErosion(ctx, w, h) {
      variantOtsu(ctx, w, h, false);
      const src = ctx.getImageData(0, 0, w, h);
      const d = src.data;
      const out = new Uint8ClampedArray(d.length);
      out.set(d);

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          if (d[i] !== 0) continue;
          let todosPretos = true;
          for (let dy = -1; dy <= 1 && todosPretos; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const ni = ((y + dy) * w + (x + dx)) * 4;
              if (d[ni] !== 0) { todosPretos = false; break; }
            }
          }
          if (!todosPretos) {
            out[i] = out[i + 1] = out[i + 2] = 255;
          }
        }
      }

      ctx.putImageData(new ImageData(out, w, h), 0, 0);
      return ctx.canvas;
    }

    function variantLimiarFixo(ctx, w, h, limiar) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const c = obterCinza(d[i], d[i + 1], d[i + 2]);
        const v = c <= limiar ? 0 : 255;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      return ctx.canvas;
    }

    function variantAmareloSuave(ctx, w, h) {
      return aplicarMascaraPixels(ctx, w, h, function(r, g, b) {
        const lum = obterCinza(r, g, b);
        const ehDigito =
          (r > 85 && g > 60 && b < 155 && r > b * 0.8) ||
          (lum > 120 && r > 80 && g > 60) ||
          (r + g > 220 && b < 140);
        return ehDigito ? 0 : 255;
      });
    }

    function variantOtsuDilatado(ctx, w, h) {
      variantOtsu(ctx, w, h, false);
      const src = ctx.getImageData(0, 0, w, h);
      const d = src.data;
      const out = new Uint8ClampedArray(d.length);
      out.set(d);

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          if (d[i] === 0) continue;
          let vizinhoPreto = false;
          for (let dy = -1; dy <= 1 && !vizinhoPreto; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const ni = ((y + dy) * w + (x + dx)) * 4;
              if (d[ni] === 0) { vizinhoPreto = true; break; }
            }
          }
          if (vizinhoPreto) {
            out[i] = out[i + 1] = out[i + 2] = 0;
          }
        }
      }

      ctx.putImageData(new ImageData(out, w, h), 0, 0);
      return ctx.canvas;
    }

    function gerarVariantesOcr(img) {
      const scale = SOS_TESS_SCALE;
      const base = escalaImagemCaptcha(img, scale);
      const copia = function(processar) {
        const c = document.createElement('canvas');
        c.width = base.w;
        c.height = base.h;
        c.getContext('2d').drawImage(base.canvas, 0, 0);
        return processar(c.getContext('2d'), base.w, base.h);
      };

      const proc = canvasMascaraSos(img);

      return [
        { id: 'sos-mask', canvas: proc.canvas, peso: 18 },
        { id: 'amarelo', canvas: copia(variantAmarelo), peso: 16 },
        { id: 'amarelo-strict', canvas: copia(variantAmareloStrict), peso: 15 },
        { id: 'otsu-ero', canvas: copia(variantOtsuErosion), peso: 10 },
        { id: 'otsu-dil', canvas: copia(variantOtsuDilatado), peso: 10 }
      ];
    }

    const MAPA_CONFUSAO_DIGITO = {
      'O': '0', 'o': '0', 'D': '0', 'Q': '0',
      'l': '1', 'I': '1', 'i': '1', '|': '1', '!': '1',
      'Z': '2', 'z': '2',
      'S': '5', 's': '5',
      'G': '6', 'b': '6',
      'B': '8', 'g': '9', 'q': '9'
    };

    function normalizarCharDigito(ch) {
      if (!ch) return '';
      if (MAPA_CONFUSAO_DIGITO[ch]) return MAPA_CONFUSAO_DIGITO[ch];
      if (ch >= '0' && ch <= '9') return ch;
      return '';
    }

    function extrairDigitosOcr(texto) {
      let out = '';
      const s = String(texto || '');
      for (let i = 0; i < s.length; i++) {
        out += normalizarCharDigito(s[i]);
      }
      return out;
    }

    function repararParaCincoDigitos(digits) {
      if (!digits) return null;
      if (digits.length === 5) return digits;

      if (digits.length > 5) {
        let melhor = null;
        let melhorScore = -1;
        for (let i = 0; i <= digits.length - 5; i++) {
          const fatia = digits.substring(i, i + 5);
          const score = 5 - i * 0.1;
          if (score > melhorScore) {
            melhorScore = score;
            melhor = fatia;
          }
        }
        return melhor;
      }

      return null;
    }

    function segmentarCincoDigitos(canvas) {
      const w = canvas.width;
      const h = canvas.height;
      const margem = Math.max(1, Math.floor(w * 0.02));
      const areaW = w - margem * 2;
      const sliceW = Math.floor(areaW / 5);
      const segmentos = [];

      for (let i = 0; i < 5; i++) {
        const seg = document.createElement('canvas');
        seg.width = sliceW;
        seg.height = h;
        const ctx = seg.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, sliceW, h);
        ctx.drawImage(
          canvas,
          margem + i * sliceW, 0, sliceW, h,
          0, 0, sliceW, h
        );
        segmentos.push(seg);
      }

      return segmentos;
    }

    function acumularMatrizPosicional(resultados) {
      const matriz = [{}, {}, {}, {}, {}];

      for (let r = 0; r < resultados.length; r++) {
        const item = resultados[r];
        if (!item.digits || item.digits.length !== 5) continue;

        const pesoBase = (item.peso || 10) * (item.metodo === 'segmentado' ? 2.2 : 1);
        const pesoVariante = pesoBase;

        for (let pos = 0; pos < 5; pos++) {
          const ch = item.digits.charAt(pos);
          if (!ch) continue;
          matriz[pos][ch] = (matriz[pos][ch] || 0) + pesoVariante;
          if (item.confidence) {
            matriz[pos][ch] += item.confidence * 0.05;
          }
        }

        if (item.posicoes && item.posicoes.length === 5) {
          for (let pos = 0; pos < 5; pos++) {
            const alt = item.posicoes[pos].alternativas || [];
            for (let a = 0; a < alt.length; a++) {
              if (!alt[a].char) continue;
              matriz[pos][alt[a].char] = (matriz[pos][alt[a].char] || 0) + pesoVariante * 0.45;
            }
          }
        }
      }

      return matriz;
    }

    function montarCodigoDaMatriz(matriz) {
      let codigo = '';
      for (let pos = 0; pos < 5; pos++) {
        const votos = matriz[pos];
        let melhorChar = '';
        let melhorPeso = -1;
        for (const ch in votos) {
          if (votos[ch] > melhorPeso) {
            melhorPeso = votos[ch];
            melhorChar = ch;
          }
        }
        if (!melhorChar) return null;
        codigo += melhorChar;
      }
      return codigo.length === 5 ? codigo : null;
    }

    let ocrUltimaSugestao = null;

    function resetarEstadoOcrSessao() {
      ocrUltimaSugestao = null;
    }

    function pontuarCandidatoOcr(digits, confidence, pesoVariante, votos, metodo) {
      if (!digits || digits.length !== 5) return -1;
      const conf = typeof confidence === 'number' ? confidence : 0;
      const bonusVoto = (votos - 1) * 200;
      const bonusSeg = metodo === 'segmentado' ? 350 : 0;
      const bonusSos = metodo === 'sos-template' ? 1200 : 0;
      return 3000 + conf + pesoVariante + bonusVoto + bonusSeg + bonusSos;
    }

    async function reconhecerCanvas(canvas, psm) {
      const result = await Tesseract.recognize(canvas, 'eng', {
        tessedit_char_whitelist: '0123456789',
        tessedit_pageseg_mode: String(psm)
      });
      const data = result.data || {};
      return {
        digits: extrairDigitosOcr(data.text),
        confidence: data.confidence || 0
      };
    }

    async function ocrSegmentadoCinco(canvas, variantId, peso) {
      const segmentos = segmentarCincoDigitos(canvas);

      const porPosicao = await Promise.all(segmentos.map(async function(seg) {
        const candidatos = {};
        const psms = ['10', '8', '13'];

        for (let p = 0; p < psms.length; p++) {
          try {
            const parsed = await reconhecerCanvas(seg, psms[p]);
            const chars = extrairDigitosOcr(parsed.digits);
            if (chars.length >= 1) {
              const ch = chars.charAt(0);
              if (!candidatos[ch] || parsed.confidence > candidatos[ch]) {
                candidatos[ch] = parsed.confidence;
              }
            }
          } catch (err) {
            console.warn('[OCR seg]', variantId, err);
          }
        }

        const ranking = Object.keys(candidatos).map(function(ch) {
          return { char: ch, conf: candidatos[ch] };
        }).sort(function(a, b) { return b.conf - a.conf; });

        return {
          char: ranking.length ? ranking[0].char : '',
          conf: ranking.length ? ranking[0].conf : -1,
          alternativas: ranking.slice(1, 3)
        };
      }));

      let codigo = '';
      let confTotal = 0;

      for (let i = 0; i < porPosicao.length; i++) {
        if (!porPosicao[i].char) return null;
        codigo += porPosicao[i].char;
        confTotal += porPosicao[i].conf;
      }

      if (codigo.length !== 5) return null;

      return {
        digits: codigo,
        confidence: confTotal / 5,
        posicoes: porPosicao,
        psm: 'seg',
        variantId: variantId,
        peso: peso,
        metodo: 'segmentado'
      };
    }

    async function ocrVariante(variante) {
      const resultados = [];

      try {
        const seg = await ocrSegmentadoCinco(variante.canvas, variante.id, variante.peso);
        if (seg) resultados.push(seg);
      } catch (err) {
        console.warn('[OCR] segmentado', variante.id, err);
      }

      const psms = ['7', '8', '13'];
      for (let i = 0; i < psms.length; i++) {
        try {
          const parsed = await reconhecerCanvas(variante.canvas, psms[i]);
          const reparado = repararParaCincoDigitos(parsed.digits);
          if (reparado) {
            resultados.push({
              digits: reparado,
              confidence: parsed.confidence,
              psm: psms[i],
              variantId: variante.id,
              peso: variante.peso,
              metodo: 'linha'
            });
          }
          if (reparado && parsed.confidence >= 85) break;
        } catch (err) {
          console.warn('[OCR]', variante.id, psms[i], err);
        }
      }

      return resultados;
    }

    function consensoPosicionalSegmentado(todos) {
      const segmentados = todos.filter(function(item) {
        return item.metodo === 'segmentado' && item.digits && item.digits.length === 5;
      });
      if (segmentados.length < 2) return null;

      let codigo = '';
      let confTotal = 0;

      for (let pos = 0; pos < 5; pos++) {
        const votos = {};
        for (let i = 0; i < segmentados.length; i++) {
          const ch = segmentados[i].digits.charAt(pos);
          if (!ch) continue;
          votos[ch] = (votos[ch] || 0) + 1;
        }

        let melhorChar = '';
        let melhorVotos = 0;
        for (const ch in votos) {
          if (votos[ch] > melhorVotos) {
            melhorVotos = votos[ch];
            melhorChar = ch;
          }
        }

        if (!melhorChar) return null;
        codigo += melhorChar;
        confTotal += melhorVotos / segmentados.length * 100;
      }

      return {
        digits: codigo,
        confidence: confTotal / 5,
        variantId: 'consenso-pos',
        peso: 20,
        metodo: 'segmentado',
        votosSegmentados: segmentados.length
      };
    }

    let ocrEmAndamento = false;

    function agendarFecharAbaAuto(motivo) {
      if (!fecharAbaAuto) return;
      setTimeout(function() {
        try { window.close(); } catch (e) {}
      }, 60000);
    }

    async function enviarComandoAsync() {
      const nomeInput = document.getElementById('nomeComandoInput');
      const valorInput = document.getElementById('valorComandoInput');
      const nomeComando = obterChaveFirebase();
      const valorComando = valorInput.value.trim();

      if (!nomeComando || !valorComando) {
        throw new Error('codigo vazio');
      }

      const refComando = database.ref(nomeComando);
      await refComando.remove();
      await refComando.set(valorComando);
      return valorComando;
    }

    async function finalizarModoAuto(resultado) {
      if (!modoAutoOcr) return;

      const status = document.getElementById('ocrStatus');
      const valorInput = document.getElementById('valorComandoInput');
      const codigo = resultado && resultado.codigoFinal;
      const digits = extrairDigitosOcr(codigo || '');

      if (digits.length !== 5) {
        status.textContent = 'Auto: OCR nao obteve 5 digitos — aguardando reload do bot (10 min)';
        agendarFecharAbaAuto('sem codigo');
        return;
      }

      valorInput.value = digits;
      status.textContent = 'Auto: enviando ' + digits + ' ao bot...';

      try {
        await enviarComandoAsync();
        status.textContent = 'Auto: enviado ' + digits + ' — fechando em breve...';
      } catch (err) {
        console.error('[Auto OCR]', err);
        status.textContent = 'Auto: falha ao enviar — ' + (err.message || err);
      }

      agendarFecharAbaAuto('fim');
    }

    function posProcessarOcr(resultado) {
      if (modoAutoOcr) {
        finalizarModoAuto(resultado);
      }
    }

    async function executarOCR() {
      const status = document.getElementById('ocrStatus');
      const valorInput = document.getElementById('valorComandoInput');
      const imgEl = document.getElementById('captchaImg');
      const btnOcr = document.getElementById('btnOcr');

      if (!captchaDataUrlAtual && !imgEl.src) {
        status.textContent = 'Nenhuma imagem carregada.';
        return Promise.resolve(null);
      }

      if (ocrEmAndamento) return Promise.resolve(null);
      ocrEmAndamento = true;
      if (btnOcr) btnOcr.disabled = true;
      status.textContent = 'Lendo numeros (OCR SOS + fallback)...';

      return new Promise(function(resolve) {
        const img = new Image();
        img.crossOrigin = 'anonymous';

        img.onload = async function() {
          let resultado = { codigoFinal: null, confOk: false };
          try {
            const todos = [];

            status.textContent = 'OCR SOS (templates captcha)...';
            const sos = await ocrSosGame(img);
            if (sos && sos.digits && sos.digits.length === 5) {
              todos.push(sos);
              console.log('[OCR SOS]', sos.digits, 'conf', sos.confidence.toFixed(1));
            }

            const variantes = gerarVariantesOcr(img);

            for (let i = 0; i < variantes.length; i++) {
              status.textContent = 'OCR fallback ' + (i + 1) + '/' + variantes.length + ' (' + variantes[i].id + ')...';
              const parciais = await ocrVariante(variantes[i]);
              for (let j = 0; j < parciais.length; j++) {
                todos.push(parciais[j]);
              }
            }

            const consenso = consensoPosicionalSegmentado(todos);
            if (consenso) todos.push(consenso);

            let matriz = acumularMatrizPosicional(todos);
            const codigoMatriz = montarCodigoDaMatriz(matriz);

            const contagem = {};
            for (let k = 0; k < todos.length; k++) {
              const d = todos[k].digits;
              if (d && d.length === 5) {
                contagem[d] = (contagem[d] || 0) + 1;
              }
            }

            let escolhido = null;
            let melhorPontuacao = -1;

            for (let m = 0; m < todos.length; m++) {
              const item = todos[m];
              if (!item.digits || item.digits.length !== 5) continue;
              const votos = contagem[item.digits] || 0;
              const pontos = pontuarCandidatoOcr(
                item.digits, item.confidence, item.peso, votos, item.metodo
              );
              if (pontos > melhorPontuacao) {
                melhorPontuacao = pontos;
                escolhido = item;
              }
            }

            let codigoFinal = codigoMatriz;
            if (codigoFinal && escolhido && codigoFinal !== escolhido.digits) {
              const votosEscolhido = contagem[escolhido.digits] || 0;
              const votosMatriz = contagem[codigoFinal] || 0;
              if (votosEscolhido > votosMatriz + 1) codigoFinal = escolhido.digits;
            } else if (!codigoFinal && escolhido) {
              codigoFinal = escolhido.digits;
            }

            ocrUltimaSugestao = codigoFinal;

            const votosEscolhido = codigoFinal ? (contagem[codigoFinal] || 0) : 0;
            const confOk = codigoFinal && (
              (sos && sos.digits === codigoFinal && sos.confidence >= 55) ||
              (escolhido && escolhido.metodo === 'sos-template') ||
              (escolhido && escolhido.metodo === 'segmentado') ||
              votosEscolhido >= 2 ||
              (escolhido && escolhido.confidence >= 72)
            );

            if (codigoFinal && confOk) {
              valorInput.value = codigoFinal;
              status.textContent = modoAutoOcr
                ? 'OCR: ' + codigoFinal + ' — enviando...'
                : 'OCR: ' + codigoFinal + ' — confira e ENVIAR';
            } else if (codigoFinal) {
              valorInput.value = codigoFinal;
              status.textContent = modoAutoOcr
                ? 'OCR incerto: ' + codigoFinal + ' — tentando enviar mesmo assim...'
                : 'OCR incerto: ' + codigoFinal + ' — confira manualmente';
            } else {
              status.textContent = modoAutoOcr
                ? 'OCR nao obteve 5 digitos (auto)'
                : 'OCR nao obteve 5 digitos — digite manualmente';
            }
            resultado = { codigoFinal: codigoFinal, confOk: confOk };
            resolve(resultado);
          } catch (err) {
            console.error(err);
            status.textContent = modoAutoOcr
              ? 'Erro no OCR (auto) — sem envio'
              : 'Erro no OCR — digite manualmente';
            resolve(null);
          } finally {
            ocrEmAndamento = false;
            if (btnOcr) btnOcr.disabled = false;
          }
        };

        img.onerror = function() {
          ocrEmAndamento = false;
          if (btnOcr) btnOcr.disabled = false;
          status.textContent = 'Erro ao carregar imagem para OCR';
          resolve(null);
        };

        img.src = captchaDataUrlAtual || imgEl.src;
      }).then(function(resultado) {
        posProcessarOcr(resultado);
        return resultado;
      });
    }

    function carregarImagemCaptchaFirebase(codigo) {
      const refImg = 'comandos/' + codigo + '/imagem';
      const preview = document.getElementById('captchaPreview');
      const imgEl = document.getElementById('captchaImg');
      const status = document.getElementById('ocrStatus');
      const btnOcr = document.getElementById('btnOcr');

      status.textContent = 'Carregando imagem do Firebase...';

      database.ref(refImg).on('value', function(snap) {
        const val = snap.val();
        if (!val) {
          status.textContent = 'Imagem ainda nao chegou — aguarde ou abra pelo Discord';
          return;
        }
        if (captchaDataUrlAtual === val) return;
        captchaDataUrlAtual = val;
        resetarEstadoOcrSessao();
        imgEl.src = val;
        preview.style.display = 'block';
        btnOcr.style.display = 'block';
        status.textContent = 'Imagem carregada — rodando OCR...';
        executarOCR();
      });
    }

    function aplicarParametrosUrl() {
      const params = new URLSearchParams(window.location.search);
      const codigo = params.get('codigo');
      modoAutoOcr = params.get('auto') === '1';
      fecharAbaAuto = params.get('fechar') === '1' || modoAutoOcr;

      const nomeInput = document.getElementById('nomeComandoInput');
      const badge = document.getElementById('badgeConta');
      const subtitulo = document.getElementById('headerSubtitulo');
      const grupoNome = document.getElementById('grupoNomeComando');

      if (modoAutoOcr) {
        document.body.classList.add('modo-auto');
        subtitulo.textContent = 'Modo automatico — OCR + envio ao bot';
      }

      if (codigo && codigo.trim()) {
        codigoContaAtual = codigo.trim();
        nomeInput.value = 'comandos/' + codigoContaAtual + '/resposta';
        nomeInput.readOnly = true;
        grupoNome.classList.add('nome-comando-oculto');
        badge.style.display = 'inline-block';
        badge.textContent = (modoAutoOcr ? 'AUTO · ' : '') + 'Conta: ' + codigoContaAtual;
        if (!modoAutoOcr) {
          subtitulo.textContent = 'Confira o OCR e clique ENVIAR AO BOT';
        }
        carregarImagemCaptchaFirebase(codigoContaAtual);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', aplicarParametrosUrl);
    } else {
      aplicarParametrosUrl();
    }

    function exibirNotificacao(mensagem, ehErro = false) {
      const toast = document.getElementById('toast');
      toast.innerText = mensagem;
      
      if (ehErro) {
        toast.classList.add('toast-error');
      } else {
        toast.classList.remove('toast-error');
      }

      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function destacarErroCampo(element) {
      element.classList.add('input-error');
      element.focus();

      element.addEventListener('input', function removerErro() {
        element.classList.remove('input-error');
        element.removeEventListener('input', removerErro);
      });
    }

    function adicionarLog(idLog, nome, valor, hora) {
      const emptyLog = document.getElementById('emptyLog');
      if (emptyLog) emptyLog.remove();

      const logsList = document.getElementById('logsList');
      const item = document.createElement('div');
      item.className = 'log-item';
      item.id = `log-${idLog}`;

      item.innerHTML = `
        <div class="log-title">
          <span>${nome} = "${valor}"</span>
          <span class="log-time">${hora}</span>
        </div>
        <div class="log-status" id="status-${idLog}">🟡 Enviado (aguardando limpeza)</div>
      `;

      logsList.prepend(item);
    }

    function atualizarLogDeletado(idLog) {
      const statusElement = document.getElementById(`status-${idLog}`);
      if (statusElement) {
        statusElement.className = 'log-status deleted';
        statusElement.innerText = '🔴 Deletado do Firebase (200ms)';
      }
    }

    function enviarComando() {
      const nomeInput = document.getElementById('nomeComandoInput');
      const valorInput = document.getElementById('valorComandoInput');

      nomeInput.classList.remove('input-error');
      valorInput.classList.remove('input-error');

      const nomeComando = obterChaveFirebase();
      const valorComando = valorInput.value.trim();

      if (!nomeComando || nomeComando.length < 1) {
        destacarErroCampo(nomeInput);
        exibirNotificacao('⚠️ Informe o Nome do Comando!', true);
        return;
      }

      if (!valorComando) {
        destacarErroCampo(valorInput);
        exibirNotificacao('⚠️ Informe o codigo do captcha!', true);
        return;
      }

      nomeInput.value = nomeComando;

      const btn = document.getElementById('btnEnviar');
      btn.disabled = true;
      btn.style.opacity = '0.7';

      const refComando = database.ref(nomeComando);
      const logId = Date.now();
      const horaAtual = new Date().toLocaleTimeString();

      // 1. Apaga antes de gravar
      refComando.remove()
        .then(() => {
          // 2. Grava o novo comando
          return refComando.set(valorComando);
        })
        .then(() => {
          adicionarLog(logId, nomeComando, valorComando, horaAtual);
          exibirNotificacao(`🚀 Enviado! Apagando em breve...`, false);

          // 3. Apaga após 200ms e atualiza o log
          setTimeout(() => {
            refComando.remove()
              .then(() => {
                atualizarLogDeletado(logId);
              })
              .catch((err) => console.error('Erro na remoção automática:', err));
          }, 200);
        })
        .catch((err) => {
          console.error('Erro ao processar comando:', err);
          exibirNotificacao('❌ Erro ao enviar para o Firebase!', true);
        })
        .finally(() => {
          btn.disabled = false;
          btn.style.opacity = '1';
        });
    }
  </script>
