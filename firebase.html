<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel de Controle - Bot Shinobi</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background-color: #1e293b;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .badge-conta {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: bold;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      background-color: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      color: #38bdf8;
      font-size: 0.95rem;
      font-weight: bold;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .input-field:focus {
      border-color: #38bdf8;
    }

    /* Animação e Borda Vermelha para Erro */
    .input-field.input-error {
      border-color: #ef4444 !important;
      background-color: rgba(239, 68, 68, 0.1) !important;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .btn-action {
      width: 100%;
      padding: 16px;
      margin-top: 6px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.97);
      background-color: #0369a1;
    }

    /* Painel de Logs */
    .logs-container {
      margin-top: 20px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
    }

    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: bold;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .logs-list {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-item {
      background-color: #1e293b;
      border-left: 4px solid #38bdf8;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .log-title {
      font-weight: bold;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
    }

    .log-time {
      font-weight: normal;
      font-size: 0.75rem;
      color: #64748b;
    }

    .log-status {
      font-size: 0.75rem;
      color: #eab308; /* Amarelo enviando */
    }

    .log-status.deleted {
      color: #ef4444; /* Vermelho deletado */
    }

    /* Toast Dynamic Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #10b981;
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: bold;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s, background-color 0.2s;
      pointer-events: none;
      z-index: 999;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.toast-error {
      background-color: #ef4444;
    }

    .captcha-preview {
      margin-bottom: 14px;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      text-align: center;
    }

    .captcha-preview img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #475569;
    }

    .captcha-preview p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 8px;
    }

    .ocr-status {
      font-size: 0.8rem;
      color: #eab308;
      margin-bottom: 10px;
      min-height: 1.2em;
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      background: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    .nome-comando-oculto { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🥷 Painel Captcha</h1>
      <p id="headerSubtitulo">Disparo remoto via Firebase</p>
      <p id="badgeConta" class="badge-conta" style="display:none;"></p>
    </div>

    <!-- Campo 1: chave Firebase (oculto no modo captcha) -->
    <div class="input-group nome-comando-oculto" id="grupoNomeComando">
      <label for="nomeComandoInput">Nome do Comando (Chave Firebase)</label>
      <input type="text" id="nomeComandoInput" class="input-field" value="comando_recebido" placeholder="Ex: comando_recebido">
    </div>

    <div id="captchaPreview" class="captcha-preview" style="display:none;">
      <label style="display:block;font-size:0.8rem;font-weight:600;color:#cbd5e1;margin-bottom:8px;text-transform:uppercase;">Imagem do captcha (Firebase)</label>
      <img id="captchaImg" alt="Captcha" />
      <p>Esta e a imagem valida — igual ao Discord.</p>
    </div>

    <p id="ocrStatus" class="ocr-status"></p>

    <!-- Campo 2: resposta -->
    <div class="input-group">
      <label for="valorComandoInput">Codigo do captcha (5 numeros)</label>
      <input type="text" id="valorComandoInput" class="input-field" value="" placeholder="Ex: 13840" inputmode="numeric" maxlength="5">
    </div>

    <button type="button" id="btnOcr" class="btn-secondary" style="display:none;" onclick="executarOCR()">
      🔍 Ler numeros (OCR)
    </button>

    <!-- Botão de Disparo -->
    <button id="btnEnviar" class="btn-action" onclick="enviarComando()">
      ⚡ ENVIAR AO BOT
    </button>

    <!-- Histórico de Logs -->
    <div class="logs-container">
      <div class="logs-header">
        <span>📜 Historico de Comandos</span>
      </div>
      <div id="logsList" class="logs-list">
        <div id="emptyLog" style="color: #64748b; font-size: 0.8rem; text-align: center; padding: 10px;">
          Nenhum comando enviado nesta sessão.
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">🚀 Comando enviado com sucesso!</div>

  <!-- Firebase JavaScript SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCn92W9swCRMJfomc30lSn4GckgA2Esjm0",
      authDomain: "shizuo-a07d9.firebaseapp.com",
      databaseURL: "https://shizuo-a07d9-default-rtdb.firebaseio.com",
      projectId: "shizuo-a07d9",
      storageBucket: "shizuo-a07d9.firebasestorage.app",
      messagingSenderId: "558853797700",
      appId: "1:558853797700:web:71e454196334d2a5be8911"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    let codigoContaAtual = null;
    let captchaDataUrlAtual = null;

    function obterChaveFirebase() {
      if (codigoContaAtual) {
        return 'comandos/' + codigoContaAtual + '/resposta';
      }
      return document.getElementById('nomeComandoInput').value.trim() || 'comando_recebido';
    }

    function obterRefImagemCaptcha() {
      if (!codigoContaAtual) return null;
      return 'comandos/' + codigoContaAtual + '/imagem';
    }

    function preprocessarCaptchaCanvas(img) {
      const scale = 3;
      const w = (img.naturalWidth || img.width || 200) * scale;
      const h = (img.naturalHeight || img.height || 60) * scale;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i];
        const g = d[i + 1];
        const b = d[i + 2];
        const ehDigito = (r > 130 && g > 110 && b < 110) || (r + g > 280 && b < 120);
        const v = ehDigito ? 0 : 255;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas;
    }

    function executarOCR() {
      const status = document.getElementById('ocrStatus');
      const valorInput = document.getElementById('valorComandoInput');
      const imgEl = document.getElementById('captchaImg');

      if (!captchaDataUrlAtual && !imgEl.src) {
        status.textContent = 'Nenhuma imagem carregada.';
        return;
      }

      status.textContent = 'Lendo numeros (OCR)...';

      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = function() {
        const canvas = preprocessarCaptchaCanvas(img);
        Tesseract.recognize(canvas, 'eng', {
          tessedit_char_whitelist: '0123456789',
          tessedit_pageseg_mode: '7'
        }).then(function(result) {
          const raw = (result.data && result.data.text) ? result.data.text : '';
          const digits = raw.replace(/\D/g, '');
          if (digits.length >= 5) {
            valorInput.value = digits.substring(0, 5);
            status.textContent = 'OCR: ' + digits.substring(0, 5) + ' — confira e clique ENVIAR';
          } else if (digits.length > 0) {
            valorInput.value = digits;
            status.textContent = 'OCR parcial: ' + digits + ' — complete manualmente';
          } else {
            status.textContent = 'OCR nao leu — digite manualmente';
          }
        }).catch(function(err) {
          console.error(err);
          status.textContent = 'Erro no OCR — digite manualmente';
        });
      };
      img.onerror = function() {
        status.textContent = 'Erro ao carregar imagem para OCR';
      };
      img.src = captchaDataUrlAtual || imgEl.src;
    }

    function carregarImagemCaptchaFirebase(codigo) {
      const refImg = 'comandos/' + codigo + '/imagem';
      const preview = document.getElementById('captchaPreview');
      const imgEl = document.getElementById('captchaImg');
      const status = document.getElementById('ocrStatus');
      const btnOcr = document.getElementById('btnOcr');

      status.textContent = 'Carregando imagem do Firebase...';

      database.ref(refImg).on('value', function(snap) {
        const val = snap.val();
        if (!val) {
          status.textContent = 'Imagem ainda nao chegou — aguarde ou abra pelo Discord';
          return;
        }
        if (captchaDataUrlAtual === val) return;
        captchaDataUrlAtual = val;
        imgEl.src = val;
        preview.style.display = 'block';
        btnOcr.style.display = 'block';
        status.textContent = 'Imagem carregada — rodando OCR...';
        executarOCR();
      });
    }

    function aplicarParametrosUrl() {
      const params = new URLSearchParams(window.location.search);
      const codigo = params.get('codigo');

      const nomeInput = document.getElementById('nomeComandoInput');
      const badge = document.getElementById('badgeConta');
      const subtitulo = document.getElementById('headerSubtitulo');
      const grupoNome = document.getElementById('grupoNomeComando');

      if (codigo && codigo.trim()) {
        codigoContaAtual = codigo.trim();
        nomeInput.value = 'comandos/' + codigoContaAtual + '/resposta';
        nomeInput.readOnly = true;
        grupoNome.classList.add('nome-comando-oculto');
        badge.style.display = 'inline-block';
        badge.textContent = 'Conta: ' + codigoContaAtual;
        subtitulo.textContent = 'Confira o OCR e clique ENVIAR AO BOT';
        carregarImagemCaptchaFirebase(codigoContaAtual);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', aplicarParametrosUrl);
    } else {
      aplicarParametrosUrl();
    }

    function exibirNotificacao(mensagem, ehErro = false) {
      const toast = document.getElementById('toast');
      toast.innerText = mensagem;
      
      if (ehErro) {
        toast.classList.add('toast-error');
      } else {
        toast.classList.remove('toast-error');
      }

      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    function destacarErroCampo(element) {
      element.classList.add('input-error');
      element.focus();

      element.addEventListener('input', function removerErro() {
        element.classList.remove('input-error');
        element.removeEventListener('input', removerErro);
      });
    }

    function adicionarLog(idLog, nome, valor, hora) {
      const emptyLog = document.getElementById('emptyLog');
      if (emptyLog) emptyLog.remove();

      const logsList = document.getElementById('logsList');
      const item = document.createElement('div');
      item.className = 'log-item';
      item.id = `log-${idLog}`;

      item.innerHTML = `
        <div class="log-title">
          <span>${nome} = "${valor}"</span>
          <span class="log-time">${hora}</span>
        </div>
        <div class="log-status" id="status-${idLog}">🟡 Enviado (aguardando limpeza)</div>
      `;

      logsList.prepend(item);
    }

    function atualizarLogDeletado(idLog) {
      const statusElement = document.getElementById(`status-${idLog}`);
      if (statusElement) {
        statusElement.className = 'log-status deleted';
        statusElement.innerText = '🔴 Deletado do Firebase (200ms)';
      }
    }

    function enviarComando() {
      const nomeInput = document.getElementById('nomeComandoInput');
      const valorInput = document.getElementById('valorComandoInput');

      nomeInput.classList.remove('input-error');
      valorInput.classList.remove('input-error');

      const nomeComando = obterChaveFirebase();
      const valorComando = valorInput.value.trim().replace(/\D/g, '');

      if (!nomeComando || nomeComando.length < 1) {
        destacarErroCampo(nomeInput);
        exibirNotificacao('⚠️ Informe o Nome do Comando!', true);
        return;
      }

      if (!valorComando || valorComando.length !== 5) {
        destacarErroCampo(valorInput);
        exibirNotificacao('⚠️ O captcha deve ter exatamente 5 numeros!', true);
        return;
      }

      valorInput.value = valorComando;
      nomeInput.value = nomeComando;

      const btn = document.getElementById('btnEnviar');
      btn.disabled = true;
      btn.style.opacity = '0.7';

      const refComando = database.ref(nomeComando);
      const logId = Date.now();
      const horaAtual = new Date().toLocaleTimeString();

      // 1. Apaga antes de gravar
      refComando.remove()
        .then(() => {
          // 2. Grava o novo comando
          return refComando.set(valorComando);
        })
        .then(() => {
          adicionarLog(logId, nomeComando, valorComando, horaAtual);
          exibirNotificacao(`🚀 Enviado! Apagando em breve...`, false);

          // 3. Apaga após 200ms e atualiza o log
          setTimeout(() => {
            refComando.remove()
              .then(() => {
                atualizarLogDeletado(logId);
              })
              .catch((err) => console.error('Erro na remoção automática:', err));
          }, 200);
        })
        .catch((err) => {
          console.error('Erro ao processar comando:', err);
          exibirNotificacao('❌ Erro ao enviar para o Firebase!', true);
        })
        .finally(() => {
          btn.disabled = false;
          btn.style.opacity = '1';
        });
    }
  </script>
</body>
</html>
