<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Painel de Controle - Bot Shinobi</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background-color: #1e293b;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .header p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-top: 4px;
    }

    .badge-conta {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #38bdf8;
      font-weight: bold;
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      background-color: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      color: #38bdf8;
      font-size: 0.95rem;
      font-weight: bold;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .input-field:focus {
      border-color: #38bdf8;
    }

    /* Animação e Borda Vermelha para Erro */
    .input-field.input-error {
      border-color: #ef4444 !important;
      background-color: rgba(239, 68, 68, 0.1) !important;
      animation: shake 0.3s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .btn-action {
      width: 100%;
      padding: 16px;
      margin-top: 6px;
      background-color: #0284c7;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      transition: background-color 0.15s, transform 0.1s;
    }

    .btn-action:active {
      transform: scale(0.97);
      background-color: #0369a1;
    }

    /* Painel de Logs */
    .logs-container {
      margin-top: 20px;
      background-color: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
    }

    .logs-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: bold;
      color: #94a3b8;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .logs-list {
      max-height: 160px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-item {
      background-color: #1e293b;
      border-left: 4px solid #38bdf8;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .log-title {
      font-weight: bold;
      color: #f1f5f9;
      display: flex;
      justify-content: space-between;
    }

    .log-time {
      font-weight: normal;
      font-size: 0.75rem;
      color: #64748b;
    }

    .log-status {
      font-size: 0.75rem;
      color: #eab308; /* Amarelo enviando */
    }

    .log-status.deleted {
      color: #ef4444; /* Vermelho deletado */
    }

    /* Toast Dynamic Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background-color: #10b981;
      color: #ffffff;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: bold;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      opacity: 0;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s, background-color 0.2s;
      pointer-events: none;
      z-index: 999;
      text-align: center;
      max-width: 90%;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.toast-error {
      background-color: #ef4444;
    }

    .captcha-preview {
      margin-bottom: 14px;
      padding: 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      text-align: center;
    }

    .captcha-preview img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #475569;
    }

    .captcha-preview p {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 8px;
    }

    .ocr-status {
      font-size: 0.8rem;
      color: #eab308;
      margin-bottom: 10px;
      min-height: 1.2em;
    }

    .btn-secondary {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      background: #334155;
      color: #e2e8f0;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
    }

    .nome-comando-oculto { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>🥷 Painel Captcha</h1>
      <p id="headerSubtitulo">Disparo remoto via Firebase</p>
      <p id="badgeConta" class="badge-conta" style="display:none;"></p>
    </div>

    <!-- Campo 1: chave Firebase (oculto no modo captcha) -->
    <div class="input-group nome-comando-oculto" id="grupoNomeComando">
      <label for="nomeComandoInput">Nome do Comando (Chave Firebase)</label>
      <input type="text" id="nomeComandoInput" class="input-field" value="comando_recebido" placeholder="Ex: comando_recebido">
    </div>

    <div id="captchaPreview" class="captcha-preview" style="display:none;">
      <label style="display:block;font-size:0.8rem;font-weight:600;color:#cbd5e1;margin-bottom:8px;text-transform:uppercase;">Imagem do captcha (Firebase)</label>
      <img id="captchaImg" alt="Captcha" />
      <p>Esta e a imagem valida — igual ao Discord.</p>
    </div>

    <p id="ocrStatus" class="ocr-status"></p>

    <!-- Campo 2: resposta -->
    <div class="input-group">
      <label for="valorComandoInput">Codigo do captcha</label>
      <input type="text" id="valorComandoInput" class="input-field" value="" placeholder="Ex: 13840">
    </div>

    <button type="button" id="btnOcr" class="btn-secondary" style="display:none;" onclick="executarOCR()">
      🔍 Ler numeros (OCR)
    </button>
    <button id="btnEnviar" class="btn-action" onclick="enviarComando()">
      ⚡ ENVIAR AO BOT
    </button>

    <!-- Histórico de Logs -->
    <div class="logs-container">
      <div class="logs-header">
        <span>📜 Historico de Comandos</span>
      </div>
      <div id="logsList" class="logs-list">
        <div id="emptyLog" style="color: #64748b; font-size: 0.8rem; text-align: center; padding: 10px;">
          Nenhum comando enviado nesta sessão.
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast">🚀 Comando enviado com sucesso!</div>

  <!-- Firebase JavaScript SDK v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCn92W9swCRMJfomc30lSn4GckgA2Esjm0",
      authDomain: "shizuo-a07d9.firebaseapp.com",
      databaseURL: "https://shizuo-a07d9-default-rtdb.firebaseio.com",
      projectId: "shizuo-a07d9",
      storageBucket: "shizuo-a07d9.firebasestorage.app",
      messagingSenderId: "558853797700",
      appId: "1:558853797700:web:71e454196334d2a5be8911"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const database = firebase.database();
    let codigoContaAtual = null;
    let captchaDataUrlAtual = null;

    function obterChaveFirebase() {
      if (codigoContaAtual) {
        return 'comandos/' + codigoContaAtual + '/resposta';
      }
      return document.getElementById('nomeComandoInput').value.trim() || 'comando_recebido';
    }

    function obterRefImagemCaptcha() {
      if (!codigoContaAtual) return null;
      return 'comandos/' + codigoContaAtual + '/imagem';
    }

    function escalaImagemCaptcha(img, scale) {
      const w = Math.max(1, Math.round((img.naturalWidth || img.width || 200) * scale));
      const h = Math.max(1, Math.round((img.naturalHeight || img.height || 60) * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, 0, 0, w, h);
      return { canvas: canvas, ctx: ctx, w: w, h: h };
    }

    function obterCinza(r, g, b) {
      return Math.round(0.299 * r + 0.587 * g + 0.114 * b);
    }

    function calcularOtsuThreshold(cinzas) {
      const hist = new Array(256).fill(0);
      for (let i = 0; i < cinzas.length; i++) hist[cinzas[i]]++;

      const total = cinzas.length;
      let sum = 0;
      for (let i = 0; i < 256; i++) sum += i * hist[i];

      let sumB = 0;
      let wB = 0;
      let maxVar = 0;
      let threshold = 128;

      for (let t = 0; t < 256; t++) {
        wB += hist[t];
        if (wB === 0) continue;
        const wF = total - wB;
        if (wF === 0) break;

        sumB += t * hist[t];
        const mB = sumB / wB;
        const mF = (sum - sumB) / wF;
        const varBetween = wB * wF * (mB - mF) * (mB - mF);

        if (varBetween > maxVar) {
          maxVar = varBetween;
          threshold = t;
        }
      }

      return threshold;
    }

    function aplicarMascaraPixels(ctx, w, h, fnPixel) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = fnPixel(d[i], d[i + 1], d[i + 2]);
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      return ctx.canvas;
    }

    function variantAmarelo(ctx, w, h) {
      return aplicarMascaraPixels(ctx, w, h, function(r, g, b) {
        const lum = obterCinza(r, g, b);
        const ehDigito =
          (r > 100 && g > 75 && b < 145 && r > b && g > b * 0.65) ||
          (r > 130 && g > 110 && b < 110) ||
          (r + g > 260 && b < 120) ||
          (lum > 135 && r > 90 && b < 130);
        return ehDigito ? 0 : 255;
      });
    }

    function variantOtsu(ctx, w, h, inverter) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      const cinzas = [];

      for (let i = 0; i < d.length; i += 4) {
        cinzas.push(obterCinza(d[i], d[i + 1], d[i + 2]));
      }

      const limiar = calcularOtsuThreshold(cinzas);
      let idx = 0;
      for (let i = 0; i < d.length; i += 4) {
        const escuro = cinzas[idx++] <= limiar;
        const v = inverter ? (escuro ? 255 : 0) : (escuro ? 0 : 255);
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }

      ctx.putImageData(imgData, 0, 0);
      return ctx.canvas;
    }

    function variantContraste(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      let min = 255;
      let max = 0;

      for (let i = 0; i < d.length; i += 4) {
        const c = obterCinza(d[i], d[i + 1], d[i + 2]);
        if (c < min) min = c;
        if (c > max) max = c;
      }

      const faixa = Math.max(1, max - min);
      for (let i = 0; i < d.length; i += 4) {
        const c = obterCinza(d[i], d[i + 1], d[i + 2]);
        const norm = Math.round(((c - min) / faixa) * 255);
        const v = norm > 128 ? 0 : 255;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }

      ctx.putImageData(imgData, 0, 0);
      return ctx.canvas;
    }

    function variantCinza(ctx, w, h) {
      return aplicarMascaraPixels(ctx, w, h, function(r, g, b) {
        return obterCinza(r, g, b);
      });
    }

    function variantAmareloStrict(ctx, w, h) {
      return aplicarMascaraPixels(ctx, w, h, function(r, g, b) {
        const lum = obterCinza(r, g, b);
        const ehDigito =
          (r > 120 && g > 95 && b < 120 && r > b + 25 && g > b + 15) ||
          (lum > 150 && r > 110 && g > 85 && b < 100);
        return ehDigito ? 0 : 255;
      });
    }

    function variantOtsuErosion(ctx, w, h) {
      variantOtsu(ctx, w, h, false);
      const src = ctx.getImageData(0, 0, w, h);
      const d = src.data;
      const out = new Uint8ClampedArray(d.length);
      out.set(d);

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          if (d[i] !== 0) continue;
          let todosPretos = true;
          for (let dy = -1; dy <= 1 && todosPretos; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const ni = ((y + dy) * w + (x + dx)) * 4;
              if (d[ni] !== 0) { todosPretos = false; break; }
            }
          }
          if (!todosPretos) {
            out[i] = out[i + 1] = out[i + 2] = 255;
          }
        }
      }

      ctx.putImageData(new ImageData(out, w, h), 0, 0);
      return ctx.canvas;
    }

    function variantLimiarFixo(ctx, w, h, limiar) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      for (let i = 0; i < d.length; i += 4) {
        const c = obterCinza(d[i], d[i + 1], d[i + 2]);
        const v = c <= limiar ? 0 : 255;
        d[i] = d[i + 1] = d[i + 2] = v;
        d[i + 3] = 255;
      }
      ctx.putImageData(imgData, 0, 0);
      return ctx.canvas;
    }

    function variantAmareloSuave(ctx, w, h) {
      return aplicarMascaraPixels(ctx, w, h, function(r, g, b) {
        const lum = obterCinza(r, g, b);
        const ehDigito =
          (r > 85 && g > 60 && b < 155 && r > b * 0.8) ||
          (lum > 120 && r > 80 && g > 60) ||
          (r + g > 220 && b < 140);
        return ehDigito ? 0 : 255;
      });
    }

    function variantOtsuDilatado(ctx, w, h) {
      variantOtsu(ctx, w, h, false);
      const src = ctx.getImageData(0, 0, w, h);
      const d = src.data;
      const out = new Uint8ClampedArray(d.length);
      out.set(d);

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = (y * w + x) * 4;
          if (d[i] === 0) continue;
          let vizinhoPreto = false;
          for (let dy = -1; dy <= 1 && !vizinhoPreto; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              const ni = ((y + dy) * w + (x + dx)) * 4;
              if (d[ni] === 0) { vizinhoPreto = true; break; }
            }
          }
          if (vizinhoPreto) {
            out[i] = out[i + 1] = out[i + 2] = 0;
          }
        }
      }

      ctx.putImageData(new ImageData(out, w, h), 0, 0);
      return ctx.canvas;
    }

    function obterConfigOcr(tentativa) {
      const perfis = [
        { scale: 5, margemSeg: 0.02, id: 'padrao' },
        { scale: 6, margemSeg: 0.035, id: 'retry-amplo' },
        { scale: 4, margemSeg: 0.01, id: 'retry-fino' },
        { scale: 6, margemSeg: 0.05, id: 'retry-desloc' }
      ];
      const perfil = perfis[tentativa % perfis.length];
      return {
        tentativa: tentativa,
        scale: perfil.scale,
        margemSeg: perfil.margemSeg,
        perfilId: perfil.id,
        ehRetry: tentativa > 0
      };
    }

    function gerarVariantesOcr(img, config) {
      const cfg = config || obterConfigOcr(0);
      const scale = cfg.scale;
      const base = escalaImagemCaptcha(img, scale);
      const copia = function(processar) {
        const c = document.createElement('canvas');
        c.width = base.w;
        c.height = base.h;
        c.getContext('2d').drawImage(base.canvas, 0, 0);
        return processar(c.getContext('2d'), base.w, base.h);
      };

      const variantes = [
        { id: 'amarelo', canvas: copia(variantAmarelo), peso: 14 },
        { id: 'amarelo-strict', canvas: copia(variantAmareloStrict), peso: 16 },
        { id: 'amarelo-suave', canvas: copia(variantAmareloSuave), peso: 12 },
        { id: 'otsu', canvas: copia(function(ctx, w, h) { return variantOtsu(ctx, w, h, false); }), peso: 12 },
        { id: 'otsu-inv', canvas: copia(function(ctx, w, h) { return variantOtsu(ctx, w, h, true); }), peso: 12 },
        { id: 'otsu-dil', canvas: copia(variantOtsuDilatado), peso: 14 },
        { id: 'otsu-ero', canvas: copia(variantOtsuErosion), peso: 13 },
        { id: 'contraste', canvas: copia(variantContraste), peso: 10 },
        { id: 'limiar-100', canvas: copia(function(ctx, w, h) { return variantLimiarFixo(ctx, w, h, 100); }), peso: 9 },
        { id: 'limiar-140', canvas: copia(function(ctx, w, h) { return variantLimiarFixo(ctx, w, h, 140); }), peso: 9 },
        { id: 'cinza', canvas: copia(variantCinza), peso: 6 }
      ];

      if (cfg.ehRetry) {
        for (let i = 0; i < variantes.length; i++) {
          variantes[i].peso += 2;
        }
      }

      return variantes;
    }

    const MAPA_CONFUSAO_DIGITO = {
      'O': '0', 'o': '0', 'D': '0', 'Q': '0',
      'l': '1', 'I': '1', 'i': '1', '|': '1', '!': '1',
      'Z': '2', 'z': '2',
      'S': '5', 's': '5',
      'G': '6', 'b': '6',
      'B': '8', 'g': '9', 'q': '9'
    };

    function normalizarCharDigito(ch) {
      if (!ch) return '';
      if (MAPA_CONFUSAO_DIGITO[ch]) return MAPA_CONFUSAO_DIGITO[ch];
      if (ch >= '0' && ch <= '9') return ch;
      return '';
    }

    function extrairDigitosOcr(texto) {
      let out = '';
      const s = String(texto || '');
      for (let i = 0; i < s.length; i++) {
        out += normalizarCharDigito(s[i]);
      }
      return out;
    }

    function repararParaCincoDigitos(digits) {
      if (!digits) return null;
      if (digits.length === 5) return digits;

      if (digits.length > 5) {
        let melhor = null;
        let melhorScore = -1;
        for (let i = 0; i <= digits.length - 5; i++) {
          const fatia = digits.substring(i, i + 5);
          const score = 5 - i * 0.1;
          if (score > melhorScore) {
            melhorScore = score;
            melhor = fatia;
          }
        }
        return melhor;
      }

      return null;
    }

    function segmentarCincoDigitos(canvas, margemPct) {
      const w = canvas.width;
      const h = canvas.height;
      const margem = Math.max(1, Math.floor(w * (margemPct != null ? margemPct : 0.02)));
      const areaW = w - margem * 2;
      const sliceW = Math.floor(areaW / 5);
      const segmentos = [];

      for (let i = 0; i < 5; i++) {
        const seg = document.createElement('canvas');
        seg.width = sliceW;
        seg.height = h;
        const ctx = seg.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, sliceW, h);
        ctx.drawImage(
          canvas,
          margem + i * sliceW, 0, sliceW, h,
          0, 0, sliceW, h
        );
        segmentos.push(seg);
      }

      return segmentos;
    }

    function segmentarDigitoUnico(canvas, indice, margemPct, deslocPct) {
      const w = canvas.width;
      const h = canvas.height;
      const margem = Math.max(1, Math.floor(w * (margemPct != null ? margemPct : 0.02)));
      const desloc = Math.round(w * (deslocPct || 0));
      const areaW = w - margem * 2;
      const sliceW = Math.floor(areaW / 5);
      const sx = Math.max(0, Math.min(w - sliceW, margem + indice * sliceW + desloc));

      const seg = document.createElement('canvas');
      seg.width = sliceW;
      seg.height = h;
      const ctx = seg.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, sliceW, h);
      ctx.drawImage(canvas, sx, 0, sliceW, h, 0, 0, sliceW, h);
      return seg;
    }

    function distanciaHamming(a, b) {
      if (!a || !b || a.length !== b.length) return 99;
      let d = 0;
      for (let i = 0; i < a.length; i++) {
        if (a.charAt(i) !== b.charAt(i)) d++;
      }
      return d;
    }

    function acumularMatrizPosicional(resultados) {
      const matriz = [{}, {}, {}, {}, {}];

      for (let r = 0; r < resultados.length; r++) {
        const item = resultados[r];
        if (!item.digits || item.digits.length !== 5) continue;

        const pesoBase = (item.peso || 10) * (item.metodo === 'segmentado' ? 2.2 : 1);
        const bonusRetry = item.tentativa > 0 ? 1.35 : 1;
        const bonusAlvo = item.posicaoAlvo != null ? 1.5 : 1;
        const peso = pesoBase * bonusRetry * bonusAlvo;

        if (item.parcial && item.posicaoAlvo != null) {
          const pos = item.posicaoAlvo;
          const ch = item.digits.charAt(pos);
          if (ch && ch !== '?') {
            matriz[pos][ch] = (matriz[pos][ch] || 0) + peso;
            if (item.confidence) matriz[pos][ch] += item.confidence * 0.08;
          }
          if (item.posicoes && item.posicoes[0]) {
            const alt = item.posicoes[0].alternativas || [];
            for (let a = 0; a < alt.length; a++) {
              if (!alt[a].char) continue;
              matriz[pos][alt[a].char] = (matriz[pos][alt[a].char] || 0) + peso * 0.5;
            }
          }
          continue;
        }

        for (let pos = 0; pos < 5; pos++) {
          const ch = item.digits.charAt(pos);
          if (!ch) continue;
          matriz[pos][ch] = (matriz[pos][ch] || 0) + peso;
          if (item.confidence) {
            matriz[pos][ch] += item.confidence * 0.05;
          }
        }

        if (item.posicoes && item.posicoes.length === 5) {
          for (let pos = 0; pos < 5; pos++) {
            const alt = item.posicoes[pos].alternativas || [];
            for (let a = 0; a < alt.length; a++) {
              if (!alt[a].char) continue;
              matriz[pos][alt[a].char] = (matriz[pos][alt[a].char] || 0) + peso * 0.45;
            }
          }
        }
      }

      return matriz;
    }

    function detectarPosicoesDuvidosas(matriz) {
      const duvidosas = [];

      for (let pos = 0; pos < 5; pos++) {
        const votos = matriz[pos];
        const ordenado = Object.keys(votos).map(function(ch) {
          return { char: ch, peso: votos[ch] };
        }).sort(function(a, b) { return b.peso - a.peso; });

        if (ordenado.length < 2) continue;

        const margem = ordenado[0].peso - ordenado[1].peso;
        const ratio = ordenado[1].peso / Math.max(ordenado[0].peso, 0.01);

        if (margem < 4 || ratio > 0.55) {
          duvidosas.push({
            pos: pos,
            opcoes: ordenado.slice(0, 3).map(function(o) { return o.char; }),
            margem: margem,
            lider: ordenado[0].char,
            segundo: ordenado[1].char
          });
        }
      }

      return duvidosas;
    }

    function montarCodigoDaMatriz(matriz) {
      let codigo = '';
      for (let pos = 0; pos < 5; pos++) {
        const votos = matriz[pos];
        let melhorChar = '';
        let melhorPeso = -1;
        for (const ch in votos) {
          if (votos[ch] > melhorPeso) {
            melhorPeso = votos[ch];
            melhorChar = ch;
          }
        }
        if (!melhorChar) return null;
        codigo += melhorChar;
      }
      return codigo.length === 5 ? codigo : null;
    }

    function mesclarCodigoComEstaveis(codigoAnterior, matriz, duvidosas) {
      const codigoMatriz = montarCodigoDaMatriz(matriz);
      if (!codigoMatriz) return codigoAnterior || null;
      if (!codigoAnterior || codigoAnterior.length !== 5 || !duvidosas || !duvidosas.length) {
        return codigoMatriz;
      }

      const posDuvida = {};
      for (let i = 0; i < duvidosas.length; i++) {
        posDuvida[duvidosas[i].pos] = true;
      }

      let mesclado = '';
      for (let pos = 0; pos < 5; pos++) {
        if (posDuvida[pos]) {
          mesclado += codigoMatriz.charAt(pos);
        } else {
          mesclado += codigoAnterior.charAt(pos);
        }
      }
      return mesclado;
    }

    function resolverClusterHamming1(contagem, matriz) {
      const codigos = Object.keys(contagem).sort(function(a, b) {
        return contagem[b] - contagem[a];
      });
      if (codigos.length < 2) return null;

      const top = codigos.slice(0, 4);
      for (let i = 0; i < top.length; i++) {
        for (let j = i + 1; j < top.length; j++) {
          if (distanciaHamming(top[i], top[j]) === 1) {
            const reconstruido = montarCodigoDaMatriz(matriz);
            if (reconstruido && reconstruido !== top[i] && reconstruido !== top[j]) {
              return reconstruido;
            }
            if (reconstruido && (reconstruido === top[i] || reconstruido === top[j])) {
              return reconstruido;
            }
          }
        }
      }
      return null;
    }

    function pontuarCandidatoOcr(digits, confidence, pesoVariante, votos, metodo) {
      if (!digits || digits.length !== 5) return -1;
      const conf = typeof confidence === 'number' ? confidence : 0;
      const bonusVoto = (votos - 1) * 200;
      const bonusSeg = metodo === 'segmentado' ? 350 : 0;
      return 3000 + conf + pesoVariante + bonusVoto + bonusSeg;
    }

    async function reconhecerCanvas(canvas, psm) {
      const result = await Tesseract.recognize(canvas, 'eng', {
        tessedit_char_whitelist: '0123456789',
        tessedit_pageseg_mode: String(psm)
      });
      const data = result.data || {};
      return {
        digits: extrairDigitosOcr(data.text),
        confidence: data.confidence || 0
      };
    }

    async function ocrSegmentadoCinco(canvas, variantId, peso, margemSeg) {
      const segmentos = segmentarCincoDigitos(canvas, margemSeg);

      const porPosicao = await Promise.all(segmentos.map(async function(seg) {
        const candidatos = {};
        const psms = ['10', '8', '13'];

        for (let p = 0; p < psms.length; p++) {
          try {
            const parsed = await reconhecerCanvas(seg, psms[p]);
            const chars = extrairDigitosOcr(parsed.digits);
            if (chars.length >= 1) {
              const ch = chars.charAt(0);
              if (!candidatos[ch] || parsed.confidence > candidatos[ch]) {
                candidatos[ch] = parsed.confidence;
              }
            }
          } catch (err) {
            console.warn('[OCR seg]', variantId, err);
          }
        }

        const ranking = Object.keys(candidatos).map(function(ch) {
          return { char: ch, conf: candidatos[ch] };
        }).sort(function(a, b) { return b.conf - a.conf; });

        return {
          char: ranking.length ? ranking[0].char : '',
          conf: ranking.length ? ranking[0].conf : -1,
          alternativas: ranking.slice(1, 3)
        };
      }));

      let codigo = '';
      let confTotal = 0;

      for (let i = 0; i < porPosicao.length; i++) {
        if (!porPosicao[i].char) return null;
        codigo += porPosicao[i].char;
        confTotal += porPosicao[i].conf;
      }

      if (codigo.length !== 5) return null;

      return {
        digits: codigo,
        confidence: confTotal / 5,
        posicoes: porPosicao,
        psm: 'seg',
        variantId: variantId,
        peso: peso,
        metodo: 'segmentado'
      };
    }

    async function ocrDigitoComVariantes(canvas, indicePos, variantId, peso, config) {
      const margens = config.ehRetry
        ? [config.margemSeg, config.margemSeg + 0.015, config.margemSeg - 0.01]
        : [config.margemSeg];
      const deslocs = config.ehRetry ? [0, 0.008, -0.008] : [0];
      const candidatos = {};

      for (let m = 0; m < margens.length; m++) {
        for (let d = 0; d < deslocs.length; d++) {
          const seg = segmentarDigitoUnico(canvas, indicePos, margens[m], deslocs[d]);
          const psms = ['10', '8', '13'];
          for (let p = 0; p < psms.length; p++) {
            try {
              const parsed = await reconhecerCanvas(seg, psms[p]);
              const chars = extrairDigitosOcr(parsed.digits);
              if (chars.length >= 1) {
                const ch = chars.charAt(0);
                const score = parsed.confidence + (config.ehRetry ? 5 : 0);
                if (!candidatos[ch] || score > candidatos[ch]) {
                  candidatos[ch] = score;
                }
              }
            } catch (err) {
              console.warn('[OCR alvo]', variantId, indicePos, err);
            }
          }
        }
      }

      const ranking = Object.keys(candidatos).map(function(ch) {
        return { char: ch, conf: candidatos[ch] };
      }).sort(function(a, b) { return b.conf - a.conf; });

      if (!ranking.length) return null;

      const posicoes = [{ char: '', conf: -1, alternativas: [] }];
      posicoes[0] = {
        char: ranking[0].char,
        conf: ranking[0].conf,
        alternativas: ranking.slice(1, 3)
      };

      const digitsArr = ['?', '?', '?', '?', '?'];
      digitsArr[indicePos] = ranking[0].char;

      return {
        digits: digitsArr.join(''),
        confidence: ranking[0].conf,
        posicoes: posicoes,
        posicaoAlvo: indicePos,
        variantId: variantId + '-pos' + indicePos,
        peso: peso + 8,
        metodo: 'segmentado',
        parcial: true
      };
    }

    async function ocrPosicoesDuvidosas(img, duvidosas, config) {
      if (!duvidosas || !duvidosas.length) return [];

      const base = escalaImagemCaptcha(img, config.scale);
      const processadores = [
        { fn: variantAmareloStrict, id: 'strict', peso: 20 },
        { fn: variantOtsuDilatado, id: 'dil', peso: 18 },
        { fn: variantOtsuErosion, id: 'ero', peso: 18 },
        { fn: function(ctx, w, h) { return variantLimiarFixo(ctx, w, h, 120); }, id: 'lim120', peso: 16 }
      ];

      const resultados = [];

      for (let d = 0; d < duvidosas.length; d++) {
        const alvo = duvidosas[d].pos;

        for (let v = 0; v < processadores.length; v++) {
          const c = document.createElement('canvas');
          c.width = base.w;
          c.height = base.h;
          const ctx = c.getContext('2d');
          ctx.drawImage(base.canvas, 0, 0);
          processadores[v].fn(ctx, base.w, base.h);

          const parcial = await ocrDigitoComVariantes(
            c, alvo, processadores[v].id, processadores[v].peso, config
          );
          if (parcial) {
            parcial.tentativa = config.tentativa;
            resultados.push(parcial);
          }
        }
      }

      return resultados;
    }

    async function ocrVariante(variante, config) {
      const resultados = [];
      const margemSeg = config ? config.margemSeg : 0.02;

      try {
        const seg = await ocrSegmentadoCinco(
          variante.canvas, variante.id, variante.peso, margemSeg
        );
        if (seg) resultados.push(seg);
      } catch (err) {
        console.warn('[OCR] segmentado', variante.id, err);
      }

      const psms = ['7', '8', '13'];
      for (let i = 0; i < psms.length; i++) {
        try {
          const parsed = await reconhecerCanvas(variante.canvas, psms[i]);
          const reparado = repararParaCincoDigitos(parsed.digits);
          if (reparado) {
            resultados.push({
              digits: reparado,
              confidence: parsed.confidence,
              psm: psms[i],
              variantId: variante.id,
              peso: variante.peso,
              metodo: 'linha'
            });
          }
          if (reparado && parsed.confidence >= 85) break;
        } catch (err) {
          console.warn('[OCR]', variante.id, psms[i], err);
        }
      }

      return resultados;
    }

    function consensoPosicionalSegmentado(todos) {
      const segmentados = todos.filter(function(item) {
        return item.metodo === 'segmentado' && item.digits && item.digits.length === 5;
      });
      if (segmentados.length < 2) return null;

      let codigo = '';
      let confTotal = 0;

      for (let pos = 0; pos < 5; pos++) {
        const votos = {};
        for (let i = 0; i < segmentados.length; i++) {
          const ch = segmentados[i].digits.charAt(pos);
          if (!ch) continue;
          votos[ch] = (votos[ch] || 0) + 1;
        }

        let melhorChar = '';
        let melhorVotos = 0;
        for (const ch in votos) {
          if (votos[ch] > melhorVotos) {
            melhorVotos = votos[ch];
            melhorChar = ch;
          }
        }

        if (!melhorChar) return null;
        codigo += melhorChar;
        confTotal += melhorVotos / segmentados.length * 100;
      }

      return {
        digits: codigo,
        confidence: confTotal / 5,
        variantId: 'consenso-pos',
        peso: 20,
        metodo: 'segmentado',
        votosSegmentados: segmentados.length
      };
    }

    let ocrEmAndamento = false;
    let ocrTentativaNum = 0;
    let ocrHistoricoTodos = [];
    let ocrUltimoResultado = null;

    function resetarEstadoOcr() {
      ocrTentativaNum = 0;
      ocrHistoricoTodos = [];
      ocrUltimoResultado = null;
      const btnOcr = document.getElementById('btnOcr');
      if (btnOcr) btnOcr.textContent = '🔍 Ler numeros (OCR)';
    }

    function formatarPosicoesDuvidosas(duvidosas) {
      if (!duvidosas || !duvidosas.length) return '';
      return duvidosas.map(function(d) {
        return 'pos' + (d.pos + 1) + ':' + d.lider + '/' + d.segundo;
      }).join(', ');
    }

    async function executarOCR() {
      const status = document.getElementById('ocrStatus');
      const valorInput = document.getElementById('valorComandoInput');
      const imgEl = document.getElementById('captchaImg');
      const btnOcr = document.getElementById('btnOcr');

      if (!captchaDataUrlAtual && !imgEl.src) {
        status.textContent = 'Nenhuma imagem carregada.';
        return;
      }

      if (ocrEmAndamento) return;
      ocrEmAndamento = true;
      if (btnOcr) btnOcr.disabled = true;

      const config = obterConfigOcr(ocrTentativaNum);
      const ehRetry = config.ehRetry;

      status.textContent = ehRetry
        ? 'Relendo captcha (tentativa ' + (ocrTentativaNum + 1) + ', perfil ' + config.perfilId + ')...'
        : 'Lendo numeros (OCR multiplo)...';

      const img = new Image();
      img.crossOrigin = 'anonymous';

      img.onload = async function() {
        try {
          const todos = [];
          const posicoesAlvoRetry = ehRetry && ocrUltimoResultado
            ? ocrUltimoResultado.posicoesDuvidosas
            : [];

          if (ehRetry && posicoesAlvoRetry.length) {
            status.textContent = 'Refocando digitos em duvida (' +
              formatarPosicoesDuvidosas(posicoesAlvoRetry) + ')...';
            const extras = await ocrPosicoesDuvidosas(
              img, posicoesAlvoRetry, config
            );
            for (let e = 0; e < extras.length; e++) {
              extras[e].tentativa = config.tentativa;
              todos.push(extras[e]);
            }
          }

          const variantes = gerarVariantesOcr(img, config);

          for (let i = 0; i < variantes.length; i++) {
            status.textContent = (ehRetry ? 'Retry ' : 'OCR ') + (i + 1) + '/' +
              variantes.length + ' (' + variantes[i].id + ')...';
            const parciais = await ocrVariante(variantes[i], config);
            for (let j = 0; j < parciais.length; j++) {
              parciais[j].tentativa = config.tentativa;
              todos.push(parciais[j]);
            }
          }

          const consenso = consensoPosicionalSegmentado(todos);
          if (consenso) {
            consenso.tentativa = config.tentativa;
            todos.push(consenso);
          }

          ocrHistoricoTodos = ocrHistoricoTodos.concat(todos);
          ocrTentativaNum++;

          const matriz = acumularMatrizPosicional(ocrHistoricoTodos);
          const posicoesDuvidosas = detectarPosicoesDuvidosas(matriz);

          const contagem = {};
          for (let k = 0; k < ocrHistoricoTodos.length; k++) {
            const d = ocrHistoricoTodos[k].digits;
            if (d && d.length === 5 && d.indexOf('?') === -1) {
              contagem[d] = (contagem[d] || 0) + 1;
            }
          }

          let escolhido = null;
          let melhorPontuacao = -1;

          for (let m = 0; m < ocrHistoricoTodos.length; m++) {
            const item = ocrHistoricoTodos[m];
            if (!item.digits || item.digits.length !== 5 || item.digits.indexOf('?') !== -1) continue;
            const votos = contagem[item.digits] || 0;
            const pontos = pontuarCandidatoOcr(
              item.digits, item.confidence, item.peso, votos, item.metodo
            );
            if (pontos > melhorPontuacao) {
              melhorPontuacao = pontos;
              escolhido = item;
            }
          }

          const cluster = resolverClusterHamming1(contagem, matriz);
          const codigoAnterior = ocrUltimoResultado && ehRetry
            ? ocrUltimoResultado.digits
            : null;
          const posicoesMescla = ehRetry && posicoesAlvoRetry.length
            ? posicoesAlvoRetry
            : posicoesDuvidosas;
          let codigoFinal = mesclarCodigoComEstaveis(codigoAnterior, matriz, posicoesMescla);

          if (cluster) {
            codigoFinal = cluster;
          } else if (!codigoFinal && escolhido) {
            codigoFinal = escolhido.digits;
          }

          ocrUltimoResultado = {
            digits: codigoFinal,
            posicoesDuvidosas: posicoesDuvidosas,
            matriz: matriz,
            tentativa: ocrTentativaNum
          };

          const votosFinal = codigoFinal ? (contagem[codigoFinal] || 0) : 0;
          const confOk = codigoFinal && (
            posicoesDuvidosas.length === 0 ||
            votosFinal >= 2 ||
            ocrTentativaNum >= 2 ||
            (escolhido && escolhido.metodo === 'segmentado')
          );

          if (btnOcr) {
            btnOcr.textContent = '🔍 Ler novamente (ajustar digitos em duvida)';
          }

          if (codigoFinal && confOk) {
            valorInput.value = codigoFinal;
            status.textContent = 'OCR: ' + codigoFinal +
              (ehRetry ? ' [retry ' + config.perfilId + ']' : '') +
              (posicoesDuvidosas.length
                ? ' — ainda em duvida: ' + formatarPosicoesDuvidosas(posicoesDuvidosas)
                : ' — confira e ENVIAR');
          } else if (codigoFinal) {
            valorInput.value = codigoFinal;
            status.textContent = 'OCR incerto: ' + codigoFinal +
              ' — clique LER NOVAMENTE (' +
              formatarPosicoesDuvidosas(posicoesDuvidosas) + ')';
          } else {
            status.textContent = 'OCR nao obteve 5 digitos — clique LER NOVAMENTE ou digite manualmente';
          }
        } catch (err) {
          console.error(err);
          status.textContent = 'Erro no OCR — digite manualmente ou clique LER NOVAMENTE';
        } finally {
          ocrEmAndamento = false;
          if (btnOcr) btnOcr.disabled = false;
        }
      };

      img.onerror = function() {
        ocrEmAndamento = false;
        if (btnOcr) btnOcr.disabled = false;
        status.textContent = 'Erro ao carregar imagem para OCR';
      };

      img.src = captchaDataUrlAtual || imgEl.src;
    }

    function carregarImagemCaptchaFirebase(codigo) {
      const refImg = 'comandos/' + codigo + '/imagem';
      const preview = document.getElementById('captchaPreview');
      const imgEl = document.getElementById('captchaImg');
      const status = document.getElementById('ocrStatus');
      const btnOcr = document.getElementById('btnOcr');

      status.textContent = 'Carregando imagem do Firebase...';

      database.ref(refImg).on('value', function(snap) {
        const val = snap.val();
        if (!val) {
          status.textContent = 'Imagem ainda nao chegou — aguarde ou abra pelo Discord';
          return;
        }
        if (captchaDataUrlAtual === val) return;
        captchaDataUrlAtual = val;
        resetarEstadoOcr();
        imgEl.src = val;
        preview.style.display = 'block';
        btnOcr.style.display = 'block';
        status.textContent = 'Imagem carregada — rodando OCR...';
        executarOCR();
      });
    }

    function aplicarParametrosUrl() {
      const params = new URLSearchParams(window.location.search);
      const codigo = params.get('codigo');

      const nomeInput = document.getElementById('nomeComandoInput');
      const badge = document.getElementById('badgeConta');
      const subtitulo = document.getElementById('headerSubtitulo');

      if (codigo && codigo.trim()) {
        codigoContaAtual = codigo.trim();
        nomeInput.value = 'comandos/' + codigoContaAtual + '/resposta';
        nomeInput.readOnly = true;
        grupoNome.classList.add('nome-comando-oculto');
        badge.style.display = 'inline-block';

        subtitulo.textContent = 'Confira o OCR e clique ENVIAR AO BOT';

      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', aplicarParametrosUrl);
    } else {

    }

    function adicionarLog(idLog, nome, valor, hora) {
      const emptyLog = document.getElementById('emptyLog');
      if (emptyLog) emptyLog.remove();

      const logsList = document.getElementById('logsList');
      const item = document.createElement('div');
      item.className = 'log-item';

    function enviarComando() {
      const nomeInput = document.getElementById('nomeComandoInput');
      const valorInput = document.getElementById('valorComandoInput');

      nomeInput.classList.remove('input-error');
      valorInput.classList.remove('input-error');

      const nomeComando = obterChaveFirebase();
      const valorComando = valorInput.value.trim();

      if (!nomeComando || nomeComando.length < 1) {
        destacarErroCampo(nomeInput);
        exibirNotificacao('⚠️ Informe o Nome do Comando!', true);
        return;
      }

      if (!valorComando) {
        destacarErroCampo(valorInput);
        exibirNotificacao('⚠️ Informe o codigo do captcha!', true);
        return;
      }
      nomeInput.value = nomeComando;

      const btn = document.getElementById('btnEnviar');
      btn.disabled = true;
      btn.style.opacity = '0.7';

      const refComando = database.ref(nomeComando);
      const logId = Date.now();
      const horaAtual = new Date().toLocaleTimeString();

      // 1. Apaga antes de gravar
      refComando.remove()
        .then(() => {
          // 2. Grava o novo comando
          return refComando.set(valorComando);
        })
        .then(() => {
          adicionarLog(logId, nomeComando, valorComando, horaAtual);
          exibirNotificacao(`🚀 Enviado! Apagando em breve...`, false);

          // 3. Apaga após 200ms e atualiza o log
          setTimeout(() => {
            refComando.remove()
              .then(() => {
                atualizarLogDeletado(logId);
              })
              .catch((err) => console.error('Erro na remoção automática:', err));
          }, 200);
        })
        .catch((err) => {
          console.error('Erro ao processar comando:', err);
          exibirNotificacao('❌ Erro ao enviar para o Firebase!', true);
        })
        .finally(() => {
          btn.disabled = false;
          btn.style.opacity = '1';
        });
    }
  </script>
</body>
</html>
